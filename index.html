<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaWeb Trader Pro</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Top Navigation Bar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold text-blue-500 tracking-wider">METAWEB 5</span>
            <span class="bg-green-900 text-green-400 text-xs px-2 py-0.5 rounded font-mono">LIVE CONNECTED</span>
        </div>
        <div class="flex items-center space-x-6">
            <div class="text-right">
                <p class="text-xs text-gray-400">Account Balance</p>
                <p id="balance" class="text-sm font-bold text-green-400">$10,000.00 USD</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">Equity</p>
                <p id="equity" class="text-sm font-bold text-white">$10,000.00</p>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Left Sidebar: Market Watch -->
        <aside class="w-1/4 bg-gray-900 border-r border-gray-800 p-4 overflow-y-auto">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Market Watch</h3>
            <div class="space-y-2">
                <!-- Asset 1 -->
                <div class="flex justify-between items-center p-3 bg-gray-800 rounded cursor-pointer border border-blue-500">
                    <div>
                        <p class="font-bold text-sm">EURUSD</p>
                        <p class="text-xs text-gray-400">Euro / US Dollar</p>
                    </div>
                    <div class="text-right">
                        <p id="eurusd-price" class="font-mono text-sm text-green-400 font-bold">1.09245</p>
                        <p class="text-xs text-green-500">+0.12%</p>
                    </div>
                </div>
                <!-- Asset 2 -->
                <div class="flex justify-between items-center p-3 bg-gray-800 rounded opacity-60">
                    <div>
                        <p class="font-bold text-sm">GBPUSD</p>
                        <p class="text-xs text-gray-400">Pound / US Dollar</p>
                    </div>
                    <div class="text-right">
                        <p class="font-mono text-sm text-red-400">1.27310</p>
                        <p class="text-xs text-red-500">-0.05%</p>
                    </div>
                </div>
                <!-- Asset 3 -->
                <div class="flex justify-between items-center p-3 bg-gray-800 rounded opacity-60">
                    <div>
                        <p class="font-bold text-sm">BTCUSD</p>
                        <p class="text-xs text-gray-400">Bitcoin / USD</p>
                    </div>
                    <div class="text-right">
                        <p class="font-mono text-sm text-green-400">67,420.00</p>
                        <p class="text-xs text-green-500">+2.41%</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Layout: Chart & Execution -->
        <main class="flex-1 flex flex-col bg-black">
            <!-- Chart Container -->
            <div class="flex-1 p-6 relative">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                        <span>EURUSD, M1</span>
                        <span class="text-xs font-normal text-gray-400 bg-gray-800 px-2 py-0.5 rounded">Candlestick Feed Sim</span>
                    </h2>
                </div>
                <div class="w-full h-4/5">
                    <canvas id="liveTradingChart"></canvas>
                </div>
            </div>

            <!-- Execution Panel & Terminal -->
            <div class="bg-gray-900 border-t border-gray-800 p-6 flex flex-col space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex space-x-4 items-center">
                        <label class="text-xs text-gray-400 font-bold uppercase">Volume (Lots):</label>
                        <input type="number" id="lotSize" value="1.00" step="0.01" min="0.01" class="bg-black border border-gray-700 text-white rounded px-3 py-1.5 w-24 font-mono text-center focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex space-x-4 w-2/3">
                        <button onclick="executeOrder('SELL')" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded transition duration-150 transform active:scale-95">
                            SELL <span id="sellBtnPrice" class="block text-xs font-normal font-mono">1.09240</span>
                        </button>
                        <button onclick="executeOrder('BUY')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition duration-150 transform active:scale-95">
                            BUY <span id="buyBtnPrice" class="block text-xs font-normal font-mono">1.09245</span>
                        </button>
                    </div>
                </div>

                <!-- Order Terminal Log -->
                <div class="bg-black border border-gray-800 rounded p-3 h-24 overflow-y-auto font-mono text-xs text-gray-400">
                    <p class="text-gray-500">// Terminal initialized. Awaiting orders...</p>
                    <div id="terminalLog" class="space-y-1 mt-1"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Global State Configuration
        let currentPrice = 1.09245;
        let balance = 10000.00;
        
        // Chart Initialization
        const ctx = document.getElementById('liveTradingChart').getContext('2d');
        const chartData = {
            labels: Array.from({length: 20}, (_, i) => `${i}:00`),
            datasets: [{
                label: 'EURUSD Live Feed',
                data: Array.from({length: 20}, () => 1.09200 + Math.random() * 0.001),
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                tension: 0.4,
                pointRadius: 0,
                fill: true
            }]
        };

        const config = {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } }
                }
            }
        };

        const tradingChart = new Chart(ctx, config);

        // Simulate Live Price Ticks
        setInterval(() => {
            const change = (Math.random() - 0.5) * 0.0002;
            currentPrice = parseFloat((currentPrice + change).toFixed(5));
            
            // Update UI elements
            document.getElementById('eurusd-price').innerText = currentPrice;
            document.getElementById('sellBtnPrice').innerText = (currentPrice - 0.00002).toFixed(5);
            document.getElementById('buyBtnPrice').innerText = currentPrice.toFixed(5);

            // Update Chart Dataset
            chartData.datasets[0].data.shift();
            chartData.datasets[0].data.push(currentPrice);
            tradingChart.update('none');
        }, 1000);

        // Core Order Execution Logic
        function executeOrder(type) {
            const lotSize = document.getElementById('lotSize').value;
            const logTerminal = document.getElementById('terminalLog');
            const timestamp = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('p');
            logEntry.className = type === 'BUY' ? 'text-blue-400' : 'text-red-400';
            logEntry.innerHTML = `[${timestamp}] <strong>${type} MARKET ORDER</strong> Executed: ${lotSize} Lot(s) of EURUSD @ ${currentPrice}`;
            
            logTerminal.appendChild(logEntry);
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }
    </script>
</body>
</html>
